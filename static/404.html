<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="robots" content="noindex" />
    <title>Không tìm thấy trang — MathMax</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, sans-serif;
      }
      header {
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
        padding: 1rem;
        font-size: 1.25rem;
        font-weight: 700;
        color: #4f46e5;
      }
      main {
        flex: 1;
        max-width: 40rem;
        margin: 0 auto;
        padding: 4rem 1rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 2rem;
      }
      p {
        margin: 0 0 2rem;
        line-height: 1.6;
        color: #475569;
      }
      a.home {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a.home:hover {
        background: #4338ca;
      }
      a.home:focus-visible {
        outline: 2px solid #4f46e5;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>MathMax</header>
    <main>
      <h1>Trang này không tồn tại</h1>
      <p>Đường dẫn có thể đã cũ hoặc gõ nhầm. Mọi bài học đều nằm cách trang chủ một cú nhấp.</p>
      <a class="home" href="/mathmax/">Về trang chủ MathMax</a>
    </main>
  </body>
</html>
